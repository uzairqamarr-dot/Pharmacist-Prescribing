<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prescribing">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%238b5e3c'/%3E%3Ctext x='90' y='118' font-size='84' font-family='-apple-system,sans-serif' font-weight='600' fill='white' text-anchor='middle'%3ERx%3C/text%3E%3C/svg%3E">
<title>Pharmacist Prescribing &mdash; Study &amp; Semester</title>
<style>
:root{color-scheme:light dark;--bg:#faf9f7;--ink:#1c1a17;--mute:#6b6560;--line:#e8e4dd;--accent:#8b5e3c;--accent-ink:#fff;--chip:#f3f0ea;--sur:#fff;--faint:#a29b93}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--ink:#ece8e2;--mute:#9c948a;--line:#332f2b;--accent:#c69a76;--accent-ink:#171614;--chip:#2b2825;--sur:#211f1c;--faint:#6e675f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;
 display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#top h1{font-size:15px;margin:0;letter-spacing:-.2px;white-space:nowrap}
#top .sub{font-size:11.5px;color:var(--mute);white-space:nowrap}
#top .ver{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
#seg{display:flex;background:var(--chip);border-radius:9px;padding:2px;margin-left:auto}
#seg button{border:none;background:none;padding:0 16px;min-height:40px;border-radius:7px;cursor:pointer;
 font:600 13px inherit;color:var(--mute);white-space:nowrap}
#seg button.on{background:var(--sur);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#stage{position:relative;height:calc(100vh - 49px);height:calc(100dvh - 49px)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.on{display:block}
#upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;
 background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:11px 18px;
 font:600 13px inherit;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer;display:none}
#upd.on{display:block}
@media(max-width:520px){
  #top{gap:8px;padding-left:11px;padding-right:11px}
  #top .sub,#top .ver{display:none}
  #seg button{padding:7px 12px;font-size:12.5px}
}
</style>
</head>
<body>
<div id="top">
  <h1>Pharmacist Prescribing</h1>
  <span class="sub">Grad Cert &middot; UoN &middot; Semester 2 2026</span>
  <span class="ver">v2026.08.26f</span>
  <div id="seg">
    <button data-v="study" class="on">Study</button>
    <button data-v="sem">Semester</button>
  </div>
</div>
<div id="stage">
  <iframe id="f-study" class="on" title="Study hub"></iframe>
  <iframe id="f-sem" title="Semester dashboard"></iframe>
</div>
<button id="upd" type="button">Update ready &mdash; tap to reload</button>
<script>
(function(){
  "use strict";
  /* Panes are plain files loaded on first view, so a content edit is a normal
     diffable change to study.html or sem.html. No encoding step. */
  var SRC = { study: "study.html", sem: "sem.html" };
  var loaded = {};
  function show(view){
    ["study","sem"].forEach(function(v){
      document.getElementById("f-"+v).classList.toggle("on", v===view);
    });
    if(!loaded[view]){
      document.getElementById("f-"+view).src = SRC[view];
      loaded[view] = true;
    }
    try{ localStorage.setItem("phar-merged-view", view); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-v")===view);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function(b){
    b.addEventListener("click", function(){ show(b.getAttribute("data-v")); });
  });
  var start = "study";
  try{ var s = localStorage.getItem("phar-merged-view"); if(s==="sem"||s==="study") start = s; }catch(e){}
  show(start);

  /* Offline support. The worker serves from cache first so the app opens with
     no signal; a new build surfaces as a button rather than reloading under
     you mid-question. */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        /* Cold launch = the first 20 seconds, before any interaction. A new
           build found in that window applies itself silently. After that the
           button appears instead, so nothing reloads mid-question. */
        var fresh = true;
        setTimeout(function(){ fresh = false; }, 20000);
        ["pointerdown","keydown"].forEach(function(ev){
          window.addEventListener(ev, function(){ fresh = false; }, {once:true});
        });
        function apply(w){
          if(fresh){ w.postMessage("skip-waiting"); }
          else { document.getElementById("upd").classList.add("on"); }
        }
        function watch(w){
          if(!w) return;
          if(w.state === "installed" && navigator.serviceWorker.controller) return apply(w);
          w.addEventListener("statechange", function(){
            if(w.state === "installed" && navigator.serviceWorker.controller) apply(w);
          });
        }
        watch(reg.waiting);
        watch(reg.installing);
        reg.addEventListener("updatefound", function(){ watch(reg.installing); });
      }).catch(function(){});

      document.getElementById("upd").addEventListener("click", function(){
        navigator.serviceWorker.getRegistration().then(function(reg){
          var w = reg && (reg.waiting || reg.installing);
          if(w) w.postMessage("skip-waiting"); else location.reload();
        });
      });

      var reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if(reloading) return;
        reloading = true;
        location.reload();
      });
    });
  }
})();
</script>
</body>
</html>
